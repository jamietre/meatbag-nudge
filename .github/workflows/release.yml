name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: target/release/meatbag-nudge

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-binary
          path: target/release/meatbag-nudge

  bundle-macos:
    name: Bundle, sign, and notarize macOS universal app
    needs: [build-macos-arm64, build-macos-x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-binary
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-binary
          path: bin-x86_64

      - name: Create universal binary and .app bundle
        run: |
          chmod +x bin-arm64/meatbag-nudge bin-x86_64/meatbag-nudge
          lipo -create -output meatbag-nudge-universal \
            bin-arm64/meatbag-nudge \
            bin-x86_64/meatbag-nudge

          BUNDLE=meatbag-nudge.app
          mkdir -p $BUNDLE/Contents/MacOS
          cp meatbag-nudge-universal $BUNDLE/Contents/MacOS/meatbag-nudge

          cat > $BUNDLE/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>  <string>org.est.mostly-water-notifier</string>
            <key>CFBundleName</key>        <string>meatbag-nudge</string>
            <key>CFBundleDisplayName</key> <string>Mostly Water Notifier</string>
            <key>CFBundleVersion</key>     <string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key> <string>APPL</string>
            <key>NSPrincipalClass</key>    <string>NSApplication</string>
            <key>LSUIElement</key>         <true/>
          </dict>
          </plist>
          EOF

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 \
            -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Sign bundle
        run: |
          codesign --force --deep --options runtime \
            --sign "Developer ID Application: Avram Dorfman (EGDD7PHX5D)" \
            meatbag-nudge.app

      - name: Notarize bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          ditto -c -k --keepParent meatbag-nudge.app meatbag-nudge-notarize.zip
          xcrun notarytool submit meatbag-nudge-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "EGDD7PHX5D" \
            --wait
          xcrun stapler staple meatbag-nudge.app
          rm meatbag-nudge-notarize.zip

      - name: Package
        run: tar -czf meatbag-nudge-macos-universal-app.tar.gz meatbag-nudge.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-app
          path: meatbag-nudge-macos-universal-app.tar.gz

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/meatbag-nudge dist/
          tar -czf meatbag-nudge-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: meatbag-nudge-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: sudo apt-get install -y mingw-w64
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/meatbag-nudge.exe dist/
          cd dist && zip -r ../meatbag-nudge-windows-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: meatbag-nudge-windows-x86_64.zip

  release:
    name: Create Release
    needs: [build-linux, build-windows, bundle-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-app

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            meatbag-nudge-linux-x86_64.tar.gz
            meatbag-nudge-windows-x86_64.zip
            meatbag-nudge-macos-universal-app.tar.gz
