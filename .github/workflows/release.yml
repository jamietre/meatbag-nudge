name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/meatbag-nudge dist/
          tar -czf meatbag-nudge-macos-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: meatbag-nudge-macos-arm64.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/meatbag-nudge dist/
          tar -czf meatbag-nudge-macos-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-binary
          path: meatbag-nudge-macos-x86_64.tar.gz

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/meatbag-nudge dist/
          tar -czf meatbag-nudge-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: meatbag-nudge-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get install -y mingw-w64

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/meatbag-nudge.exe dist/
          cd dist && zip -r ../meatbag-nudge-windows-x86_64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: meatbag-nudge-windows-x86_64.zip

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-binary

      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-binary

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            meatbag-nudge-linux-x86_64.tar.gz
            meatbag-nudge-windows-x86_64.zip
            meatbag-nudge-macos-arm64.tar.gz
            meatbag-nudge-macos-x86_64.tar.gz
